<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>JORA AI — Profile</title>
<style>
:root{
  --primary:#6D3EF7;
  --primary-dim:#EFE9FE;
  --secondary:#8E5BFF;
  --bg:#F8F8FB;
  --card:#FFFFFF;
  --radius:22px;
  --radius-sm:14px;
  --text:#191726;
  --text-dim:#75728C;
  --text-faint:#A6A3BB;
  --border:#EFEEF6;
  --success:#22C55E;
  --success-dim:#E8FBEF;
  --danger:#F0473F;
  --danger-dim:#FDEBEA;
  --warning:#F5A524;
  --warning-dim:#FEF4E3;
  --shadow-sm:0 4px 14px -6px rgba(31,20,90,0.10);
  --shadow-md:0 14px 34px -10px rgba(31,20,90,0.20);
  --grad: linear-gradient(135deg,#6D3EF7 0%,#8E5BFF 55%,#B58AFF 100%);
  --ease: cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"]{
  --bg:#0F0D16;
  --card:#1B1826;
  --text:#F3F1FA;
  --text-dim:#A29EBD;
  --text-faint:#6E6A88;
  --border:#2B2739;
  --primary-dim:#2A2140;
  --success-dim:#123322;
  --danger-dim:#3A1917;
  --warning-dim:#3A2C10;
  --shadow-sm:0 4px 14px -6px rgba(0,0,0,0.4);
  --shadow-md:0 18px 40px -12px rgba(0,0,0,0.6);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Rounded','Segoe UI',Roboto,system-ui,sans-serif;
  background:#E7E4F3;
  display:flex; align-items:center; justify-content:center;
  min-height:100vh;
  padding:24px 12px;
  color:var(--text);
}
.phone{
  width:390px; height:844px; max-height:96vh;
  background:var(--bg);
  border-radius:46px;
  border:10px solid #16141F;
  box-shadow:0 40px 80px -20px rgba(20,10,60,0.45);
  overflow:hidden;
  position:relative;
  display:flex; flex-direction:column;
  transition:background .25s var(--ease);
}
.notch{
  position:absolute; top:0; left:50%; transform:translateX(-50%);
  width:130px; height:26px; background:#16141F; border-radius:0 0 18px 18px; z-index:50;
}
.statusbar{
  height:48px; flex:0 0 auto; display:flex; align-items:flex-end; justify-content:space-between;
  padding:0 26px 6px; font-size:13px; font-weight:600; color:var(--text);
}
.app{
  flex:1 1 auto; position:relative; overflow:hidden;
}
.view{
  position:absolute; inset:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
  opacity:0; pointer-events:none; transform:translateX(16px);
  transition:opacity .22s var(--ease), transform .22s var(--ease);
  padding-bottom:28px;
  scrollbar-width:none;
}
.view::-webkit-scrollbar{display:none;}
.view.active{opacity:1; pointer-events:auto; transform:translateX(0); z-index:2;}

.topbar{
  display:flex; align-items:center; gap:10px; padding:6px 18px 14px; position:sticky; top:0;
  background:var(--bg); z-index:5;
}
.iconbtn{
  width:38px; height:38px; border-radius:12px; border:none; background:var(--card);
  display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-sm);
  color:var(--text); cursor:pointer; flex:0 0 auto; transition:transform .15s var(--ease);
}
.iconbtn:active{transform:scale(.92);}
.topbar h1{font-size:19px; margin:0; font-weight:800; letter-spacing:-.2px; flex:1;}
.topbar .sub{font-size:12px; color:var(--text-dim); font-weight:600; margin-top:1px;}

.section-pad{padding:0 18px;}
.card{
  background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow-sm);
  padding:18px; margin-bottom:14px; border:1px solid var(--border);
}
.card h3{margin:0 0 3px; font-size:15px; font-weight:800;}
.card p.hint{margin:0; font-size:12.5px; color:var(--text-dim); line-height:1.5;}

/* ---------- HOME / PROFILE HEADER ---------- */
.profile-hero{
  background:var(--grad); border-radius:0 0 32px 32px; padding:6px 20px 26px; color:#fff; position:relative; overflow:hidden;
}
.profile-hero::before{
  content:''; position:absolute; width:220px; height:220px; border-radius:50%;
  background:rgba(255,255,255,0.09); top:-90px; right:-70px;
}
.hero-top{display:flex; align-items:center; justify-content:space-between; padding-top:2px;}
.hero-top .greet{font-size:13px; opacity:.85; font-weight:600;}
.hero-icons{display:flex; gap:8px;}
.ghost-btn{
  width:36px; height:36px; border-radius:11px; background:rgba(255,255,255,0.16); border:none;
  display:flex; align-items:center; justify-content:center; color:#fff; cursor:pointer;
}
.ghost-btn:active{transform:scale(.9);}
.avatar-wrap{position:relative; width:84px; height:84px; margin:14px auto 6px;}
.avatar{
  width:84px; height:84px; border-radius:26px; object-fit:cover; display:block;
  background:linear-gradient(135deg,#fff,#E9E3FF); box-shadow:0 8px 20px rgba(0,0,0,0.18);
  border:3px solid rgba(255,255,255,0.65);
}
.avatar-initials{
  width:84px; height:84px; border-radius:26px; display:flex; align-items:center; justify-content:center;
  font-size:28px; font-weight:800; color:var(--primary); background:#fff;
  border:3px solid rgba(255,255,255,0.65); box-shadow:0 8px 20px rgba(0,0,0,0.18);
}
.online-dot{
  position:absolute; bottom:2px; right:2px; width:16px; height:16px; border-radius:50%;
  background:var(--success); border:3px solid #7B4CF0;
}
.avatar-edit-btn{
  position:absolute; top:-4px; right:-8px; width:30px; height:30px; border-radius:10px; background:#fff;
  color:var(--primary); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer;
  box-shadow:0 4px 10px rgba(0,0,0,0.2);
}
.avatar-edit-btn:active{transform:scale(.9);}
.identity{text-align:center;}
.identity h2{margin:2px 0 0; font-size:19px; font-weight:800;}
.identity .uname{font-size:13px; opacity:.85; font-weight:600; margin-top:2px;}
.identity .email{font-size:12px; opacity:.7; margin-top:1px;}
.hero-actions{display:flex; gap:10px; margin-top:16px;}
.btn{
  border:none; border-radius:14px; font-weight:800; font-size:14px; cursor:pointer; padding:12px 16px;
  transition:transform .15s var(--ease), opacity .15s var(--ease); text-align:center;
}
.btn:active{transform:scale(.97);}
.btn-block{width:100%;}
.btn-white{background:#fff; color:var(--primary);}
.btn-ghost-line{background:rgba(255,255,255,0.14); color:#fff; border:1.5px solid rgba(255,255,255,0.5);}
.btn-primary{background:var(--grad); color:#fff; box-shadow:0 10px 24px -8px rgba(109,62,247,0.55);}
.btn-secondary{background:var(--primary-dim); color:var(--primary);}
.btn-outline{background:transparent; color:var(--text); border:1.5px solid var(--border);}
.btn-danger{background:var(--danger-dim); color:var(--danger);}
.btn-danger-solid{background:var(--danger); color:#fff;}
.btn-disabled{opacity:.45; pointer-events:none;}

.stats-grid{
  display:grid; grid-template-columns:repeat(2,1fr); gap:10px; padding:16px 18px 4px; margin-top:-16px;
}
.stat-card{
  background:var(--card); border-radius:18px; padding:13px 14px; box-shadow:var(--shadow-sm); border:1px solid var(--border);
}
.stat-card .top{display:flex; align-items:center; justify-content:space-between;}
.stat-card .ic{
  width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center;
}
.stat-card .val{font-size:19px; font-weight:800; margin-top:8px;}
.stat-card .lbl{font-size:11.5px; color:var(--text-dim); font-weight:600;}

.menu-group{padding:16px 18px 4px;}
.menu-group .grouptitle{font-size:12px; font-weight:800; color:var(--text-faint); text-transform:uppercase; letter-spacing:.6px; margin:6px 2px 8px;}
.menu-row{
  display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--border);
  padding:13px 14px; border-radius:16px; margin-bottom:9px; cursor:pointer; box-shadow:var(--shadow-sm);
  transition:transform .12s var(--ease);
}
.menu-row:active{transform:scale(.985);}
.menu-row .mi-icon{
  width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex:0 0 auto;
}
.menu-row .mi-text{flex:1; min-width:0;}
.menu-row .mi-text .t{font-weight:700; font-size:14.5px;}
.menu-row .mi-text .s{font-size:12px; color:var(--text-dim); margin-top:1px;}
.menu-row .chev{color:var(--text-faint); flex:0 0 auto;}
.menu-row .badge-pill{
  font-size:11px; font-weight:800; padding:3px 9px; border-radius:20px; background:var(--success-dim); color:var(--success);
}

/* ---------- FORM ELEMENTS ---------- */
.field{margin-bottom:14px;}
.field label{display:block; font-size:12.5px; font-weight:700; color:var(--text-dim); margin-bottom:6px;}
.field input, .field select, .field textarea{
  width:100%; border:1.5px solid var(--border); background:var(--bg); border-radius:13px; padding:12px 13px;
  font-size:14.5px; font-family:inherit; color:var(--text); outline:none; transition:border-color .15s var(--ease);
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--primary);}
.field textarea{resize:vertical; min-height:90px;}
.field .msg{font-size:11.5px; margin-top:5px; font-weight:600;}
.field .msg.ok{color:var(--success);}
.field .msg.err{color:var(--danger);}
.field-row{display:flex; gap:10px;}
.field-row .field{flex:1;}

.toggle-row{
  display:flex; align-items:center; justify-content:space-between; padding:12px 2px;
  border-bottom:1px solid var(--border);
}
.toggle-row:last-child{border-bottom:none;}
.toggle-row .tt{font-size:14px; font-weight:700;}
.toggle-row .ts{font-size:11.5px; color:var(--text-dim); margin-top:1px;}
.switch{width:46px; height:27px; border-radius:20px; background:var(--border); position:relative; cursor:pointer; flex:0 0 auto; transition:background .18s var(--ease);}
.switch::after{content:''; position:absolute; width:21px; height:21px; border-radius:50%; background:#fff; top:3px; left:3px; box-shadow:0 2px 5px rgba(0,0,0,0.25); transition:left .18s var(--ease);}
.switch.on{background:var(--primary);}
.switch.on::after{left:22px;}

/* ---------- BOTTOM SHEET / OVERLAY ---------- */
.overlay{
  position:absolute; inset:0; background:rgba(10,6,30,0.5); z-index:40; opacity:0; pointer-events:none;
  transition:opacity .2s var(--ease);
}
.overlay.show{opacity:1; pointer-events:auto;}
.sheet{
  position:absolute; left:0; right:0; bottom:0; background:var(--card); border-radius:26px 26px 0 0;
  padding:10px 20px 26px; transform:translateY(100%); transition:transform .28s var(--ease); z-index:41;
  box-shadow:0 -20px 40px rgba(0,0,0,0.2); max-height:80%; overflow-y:auto;
}
.overlay.show .sheet{transform:translateY(0);}
.sheet .handle{width:40px; height:5px; background:var(--border); border-radius:10px; margin:6px auto 16px;}
.sheet h3{margin:0 0 4px; font-size:17px; font-weight:800;}
.sheet p.hint{margin:0 0 16px; font-size:12.5px; color:var(--text-dim);}
.sheet-option{
  display:flex; align-items:center; gap:12px; padding:13px 4px; cursor:pointer; border-bottom:1px solid var(--border);
}
.sheet-option:last-child{border-bottom:none;}
.sheet-option .so-ic{width:38px; height:38px; border-radius:12px; background:var(--primary-dim); color:var(--primary); display:flex; align-items:center; justify-content:center;}
.sheet-option .so-t{font-weight:700; font-size:14.5px; flex:1;}
.sheet-option.danger .so-ic{background:var(--danger-dim); color:var(--danger);}
.sheet-option.danger .so-t{color:var(--danger);}

/* ---------- TOAST ---------- */
.toast-stack{position:absolute; top:14px; left:14px; right:14px; z-index:60; display:flex; flex-direction:column; gap:8px; pointer-events:none;}
.toast{
  background:#18162A; color:#fff; padding:12px 14px; border-radius:14px; font-size:13.5px; font-weight:700;
  display:flex; align-items:center; gap:10px; box-shadow:0 12px 26px rgba(0,0,0,0.3);
  transform:translateY(-14px); opacity:0; transition:all .25s var(--ease);
}
.toast.show{transform:translateY(0); opacity:1;}
.toast .tic{width:22px; height:22px; border-radius:50%; background:var(--success); display:flex; align-items:center; justify-content:center; flex:0 0 auto;}
.toast.error .tic{background:var(--danger);}

/* ---------- SEGMENT / CHIPS ---------- */
.chip-row{display:flex; gap:8px; overflow-x:auto; padding:2px 18px 14px; scrollbar-width:none;}
.chip-row::-webkit-scrollbar{display:none;}
.chip{
  flex:0 0 auto; padding:9px 15px; border-radius:20px; background:var(--card); border:1.5px solid var(--border);
  font-size:13px; font-weight:700; color:var(--text-dim); cursor:pointer; white-space:nowrap;
}
.chip.active{background:var(--grad); color:#fff; border-color:transparent;}

/* ---------- FAQ ---------- */
.faq-item{background:var(--card); border:1px solid var(--border); border-radius:16px; margin-bottom:9px; overflow:hidden;}
.faq-q{display:flex; align-items:center; justify-content:between; gap:10px; padding:14px; cursor:pointer; font-weight:700; font-size:14px;}
.faq-q .chev{margin-left:auto; transition:transform .2s var(--ease); color:var(--text-faint);}
.faq-item.open .faq-q .chev{transform:rotate(180deg);}
.faq-a{max-height:0; overflow:hidden; transition:max-height .25s var(--ease);}
.faq-a p{margin:0; padding:0 14px 14px; font-size:13px; color:var(--text-dim); line-height:1.55;}
.faq-item.open .faq-a{max-height:200px;}

/* ---------- MISC ---------- */
.empty-state{text-align:center; padding:40px 24px; color:var(--text-dim);}
.empty-state .ee{width:64px; height:64px; border-radius:20px; background:var(--primary-dim); color:var(--primary); display:flex; align-items:center; justify-content:center; margin:0 auto 14px;}
.empty-state h4{margin:0 0 4px; color:var(--text); font-size:15px;}
.empty-state p{margin:0; font-size:13px;}
.divider{height:1px; background:var(--border); margin:14px 0;}
.row-between{display:flex; align-items:center; justify-content:space-between;}
.badge-plan{background:var(--grad); color:#fff; font-size:11px; font-weight:800; padding:4px 10px; border-radius:20px;}
.skeleton{background:linear-gradient(90deg,var(--border) 25%,#e2dffb 37%,var(--border) 63%); background-size:400% 100%; animation:sk 1.4s ease infinite; border-radius:10px;}
@keyframes sk{0%{background-position:100% 0;}100%{background-position:0 0;}}
.spin{animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.pop-check{
  width:84px; height:84px; border-radius:50%; background:var(--success-dim); display:flex; align-items:center; justify-content:center;
  margin:0 auto 18px; animation:pop .4s var(--ease);
}
@keyframes pop{0%{transform:scale(.3); opacity:0;}70%{transform:scale(1.12);}100%{transform:scale(1); opacity:1;}}
.center-flow{display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:60px 30px;}
.avail-badge{display:inline-flex; align-items:center; gap:5px;}

/* crop modal */
.crop-stage{
  width:230px; height:230px; border-radius:50%; margin:20px auto; overflow:hidden; position:relative; background:var(--border);
  border:3px dashed var(--primary); cursor:grab; touch-action:none;
}
.crop-stage img{position:absolute; max-width:none; user-select:none; pointer-events:none;}

/* Login screen */
.login-screen{height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px; text-align:center; background:var(--grad); color:#fff;}
.login-logo{width:74px; height:74px; border-radius:22px; background:rgba(255,255,255,0.18); display:flex; align-items:center; justify-content:center; margin-bottom:20px; font-size:30px; font-weight:900;}

/* Stars & emoji */
.star-row{display:flex; gap:8px; justify-content:center; margin:10px 0 4px;}
.star-row .st{cursor:pointer; transition:transform .12s var(--ease);}
.star-row .st:active{transform:scale(.85);}
.emoji-row{display:flex; justify-content:space-between; margin:12px 0 18px;}
.emoji-btn{
  font-size:28px; background:none; border:2px solid transparent; border-radius:16px; padding:8px 10px; cursor:pointer;
  filter:grayscale(1); opacity:.55; transition:all .15s var(--ease);
}
.emoji-btn.sel{filter:none; opacity:1; border-color:var(--primary); background:var(--primary-dim); transform:scale(1.08);}

/* public profile */
.cover-banner{height:120px; background:var(--grad); border-radius:0 0 30px 30px; position:relative;}
.pp-avatar-wrap{position:absolute; left:22px; bottom:-40px;}
.pp-content{padding:50px 18px 10px;}
.badge-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
.badge-cell{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:10px 4px; text-align:center; box-shadow:var(--shadow-sm);}
.badge-cell .bi{font-size:24px;}
.badge-cell .bn{font-size:10px; font-weight:700; color:var(--text-dim); margin-top:4px; line-height:1.3;}
.progress-track{height:9px; border-radius:20px; background:var(--border); overflow:hidden; margin-top:8px;}
.progress-fill{height:100%; background:var(--grad); border-radius:20px; transition:width .5s var(--ease);}
.friend-avatars{display:flex;}
.friend-avatars .fa{width:38px; height:38px; border-radius:12px; border:2.5px solid var(--card); margin-left:-10px; box-shadow:var(--shadow-sm);}
.friend-avatars .fa:first-child{margin-left:0;}
.activity-item{display:flex; gap:12px; padding:11px 0; border-bottom:1px solid var(--border);}
.activity-item:last-child{border-bottom:none;}
.activity-item .ai-ic{width:34px; height:34px; border-radius:11px; background:var(--primary-dim); color:var(--primary); display:flex; align-items:center; justify-content:center; flex:0 0 auto;}
.activity-item .ai-t{font-size:13.5px; font-weight:600;}
.activity-item .ai-s{font-size:11.5px; color:var(--text-faint); margin-top:2px;}

/* file preview */
.file-preview{display:flex; align-items:center; gap:10px; padding:10px; border:1.5px dashed var(--border); border-radius:14px; margin-top:8px;}
.file-preview img{width:44px; height:44px; border-radius:10px; object-fit:cover;}
.file-preview .fp-name{flex:1; font-size:12.5px; font-weight:700;}
.file-preview button{background:none; border:none; color:var(--danger); cursor:pointer;}

/* chat */
.chat-box{padding:14px 18px; display:flex; flex-direction:column; gap:10px;}
.bubble{max-width:78%; padding:10px 13px; border-radius:16px; font-size:13.5px; line-height:1.5;}
.bubble.bot{background:var(--card); border:1px solid var(--border); align-self:flex-start; border-bottom-left-radius:4px;}
.bubble.me{background:var(--grad); color:#fff; align-self:flex-end; border-bottom-right-radius:4px;}
.chat-input-row{display:flex; gap:8px; padding:12px 18px; position:sticky; bottom:0; background:var(--bg);}
.chat-input-row input{flex:1; border-radius:14px; border:1.5px solid var(--border); padding:11px 14px; font-size:13.5px; background:var(--card); color:var(--text); outline:none;}
.chat-input-row button{width:44px; height:44px; border-radius:14px; background:var(--grad); border:none; color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer;}

.sticky-footer{position:sticky; bottom:0; background:var(--bg); padding:14px 18px 4px; display:flex; gap:10px; border-top:1px solid var(--border); margin-top:8px;}
.sticky-footer .btn{flex:1;}
</style>
</head>
<body>

<div class="phone" id="phone">
  <div class="notch"></div>
  <div class="statusbar">
    <span id="clock">9:41</span>
    <span>●●●● 5G 🔋</span>
  </div>
  <div class="app" id="app"></div>
  <div class="toast-stack" id="toastStack"></div>
  <div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
</div>

<script>
/* ===================== ICONS ===================== */
const ICON = {};
function ic(name, size=22, stroke=2.1){
  const paths = {
    back:'<path d="M15 18l-6-6 6-6"/>',
    chevron:'<path d="M9 18l6-6-6-6"/>',
    bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
    user:'<path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/>',
    shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
    card:'<rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20"/>',
    help:'<circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 1 1 4.9 2.3c-.9.7-1.9 1.2-1.9 2.7"/><path d="M12 17h.01"/>',
    message:'<path d="M21 11.5a8.4 8.4 0 0 1-8.9 8.4A9 9 0 1 1 21 11.5z"/>',

/* ===================== HELPERS ===================== */
function $(sel,root=document){return root.querySelector(sel);}
function el(html){const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild;}
function initials(name){return name.split(' ').filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');}

function toast(msg, type='success', icon='check'){
  const stack = $('#toastStack');
  const t = el(`<div class="toast ${type==='error'?'error':''}">
    <span class="tic">${ic(icon,13,3)}</span><span>${msg}</span></div>`);
  stack.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(),250); }, 2600);
}

function openSheet(html){
  $('#sheet').innerHTML = `<div class="handle"></div>` + html;
  $('#overlay').classList.add('show');
}
function closeSheet(){ $('#overlay').classList.remove('show'); }
$('#overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeSheet(); });

function avatarNode(size=84){

  }
  return `<div class="avatar-initials" style="width:${size}px;height:${size}px;font-size:${size*0.33}px">${initials(state.user.name)}</div>`;
}

function setTheme(t){
  state.theme=t;
  document.getElementById('phone').setAttribute('data-theme', t);
}

function openAvatarSheet(){
  openSheet(`
    <h3>Profile Photo</h3>
    <p class="hint">Choose how you'd like to update your picture.</p>
    <div class="sheet-option" id="optTakePhoto"><div class="so-ic">${ic('camera',18)}</div><div class="so-t">Take Photo</div></div>
    <div class="sheet-option" id="optGallery"><div class="so-ic">${ic('image',18)}</div><div class="so-t">Choose from Gallery</div></div>
    ${state.user.avatarUrl?`<div class="sheet-option danger" id="optRemove"><div class="so-ic">${ic('trash',18)}</div><div class="so-t">Remove Photo</div></div>`:''}
    <input type="file" accept="image/*" capture="environment" id="fileCam" style="display:none">
    <input type="file" accept="image/*" id="fileGal" style="display:none">
  `);
  $('#optTakePhoto').onclick = ()=> $('#fileCam').click();
  $('#optGallery').onclick = ()=> $('#fileGal').click();
  const handle = (input)=>{
    input.onchange = e=>{
      const f = e.target.files[0]; if(!f) return;
      const reader = new FileReader();
      reader.onload = ev=>{ closeSheet(); openCropModal(ev.target.result); };
      reader.readAsDataURL(f);
    };
  };
  handle($('#fileCam')); handle($('#fileGal'));
  const rm = $('#optRemove');
  if(rm) rm.onclick = ()=>{
    closeSheet();
    simulateUpload(()=>{ state.user.avatarUrl=null; toast('Profile photo removed'); render(currentRoute); });
  };
}

function openCropModal(dataUrl){
  let pos = {x:50,y:50};
  openSheet(`
    <h3>Crop Photo</h3>
    <p class="hint">Drag inside the circle to reposition your photo.</p>
    <div class="crop-stage" id="cropStage">
      <img id="cropImg" src="${dataUrl}" style="width:230px; left:0; top:0;">
    </div>
    <div class="sticky-footer" style="border:none; padding:6px 0 0;">
      <button class="btn btn-outline" id="cropCancel">Cancel</button>
      <button class="btn btn-primary" id="cropSave">Save Photo</button>
    </div>
  `);
  const stage = $('#cropStage'), img = $('#cropImg');
  img.style.objectPosition = '50% 50%';
  img.style.width='100%'; img.style.height='100%'; img.style.objectFit='cover'; img.style.position='absolute'; img.style.inset='0';
  img.style.objectPosition = pos.x+'% '+pos.y+'%';
  let dragging=false, start={x:0,y:0}, startPos={...pos};
  const down = e=>{ dragging=true; const p=e.touches?e.touches[0]:e; start={x:p.clientX,y:p.clientY}; startPos={...pos}; stage.style.cursor='grabbing'; };
  const move = e=>{
    if(!dragging) return;
    const p=e.touches?e.touches[0]:e;
    const dx=(p.clientX-start.x)/2, dy=(p.clientY-start.y)/2;
    pos.x = Math.min(100,Math.max(0,startPos.x - dx));
    pos.y = Math.min(100,Math.max(0,startPos.y - dy));
    img.style.objectPosition = pos.x+'% '+pos.y+'%';
  };
  const up = ()=>{ dragging=false; stage.style.cursor='grab'; };
  stage.addEventListener('mousedown',down); window.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
  stage.addEventListener('touchstart',down,{passive:true}); stage.addEventListener('touchmove',move,{passive:true}); stage.addEventListener('touchend',up);

  $('#cropCancel').onclick = closeSheet;
  $('#cropSave').onclick = ()=>{
    closeSheet();
    simulateUpload(()=>{
      state.user.avatarUrl = dataUrl; state.user.avatarPos = pos;
      toast('Profile photo updated'); render(currentRoute);
    });
  };
}

function simulateUpload(cb){
  openSheet(`<div class="center-flow"><div style="width:46px;height:46px;color:var(--primary)" class="spin">${ic('clock',46,2)}</div><p class="hint" style="margin-top:14px">Uploading...</p></div>`);
  setTimeout(()=>{ closeSheet(); cb(); }, 900);
}

function bindAccount(view){
  const ids = ['name','username','email','phone','gender','dob','country','state','city','timezone','role','exp','edu','target','domain','linkedin','github','portfolio'];
  const fields = {name:'name',username:'username',email:'email',phone:'phone',gender:'gender',dob:'dob',country:'country',state:'state',city:'city',timezone:'timezone',role:'role',exp:'experience',edu:'education',target:'targetCareer',domain:'domain',linkedin:'linkedin',github:'github',portfolio:'portfolio'};

  $('#f-username',view).addEventListener('input', e=>{
    const val = e.target.value.trim().toLowerCase();
    const msg = $('#usernameMsg',view);
    if(!val){ msg.textContent=''; return; }
    if(val !== state.user.username && state.takenUsernames.includes(val)){
      msg.textContent = '✕ Username already taken'; msg.className='msg err';
    } else {
      msg.textContent = '✓ Username available'; msg.className='msg ok';
    }
  });

  $('#twoFASwitch',view).onclick = e=>{ e.target.classList.toggle('on'); state.security.twoFA = e.target.classList.contains('on'); toast(state.security.twoFA?'Two-factor authentication enabled':'Two-factor authentication disabled'); };
  $('#changePassRow',view).onclick = openChangePasswordSheet;
  $('#devicesRow',view).onclick = openDevicesSheet;
  $('#sessionsRow',view).onclick = openSessionsSheet;

  $('#acctCancel',view).onclick = ()=>{
    if(originalUser){ Object.assign(state.user, JSON.parse(originalUser)); }
    toast('Changes discarded','error','x'); go('home');
  };
  $('#acctSave',view).onclick = ()=>{
    const usernameVal = $('#f-username',view).value.trim();
    if(!$('#f-name',view).value.trim()){ toast('Full name is required','error','x'); return; }
    if(!/^\S+@\S+\.\S+$/.test($('#f-email',view).value.trim())){ toast('Enter a valid email address','error','x'); return; }
    if(usernameVal !== state.user.username && state.takenUsernames.includes(usernameVal.toLowerCase())){
      toast('Username is already taken','error','x'); return;
    }
    ids.forEach(id=>{
      const node = $('#f-'+id, view); if(!node) return;
      state.user[fields[id]] = node.value;
    });
    toast('Profile changes saved'); go('home');
  };
}

function bindEdit(view){
  $('#editAvatarBtn',view).onclick = openAvatarSheet;
  let dirty=false, draftTimer=null;
  const markDirty = ()=>{
    dirty=true;
    $('#draftCard',view).style.display='block';
    $('#draftTime',view).textContent = 'just now';
  };
  $('#e-name',view).addEventListener('input', markDirty);
  $('#e-username',view).addEventListener('input', e=>{
    markDirty();
    const val = e.target.value.trim().toLowerCase();
    const msg = $('#editUsernameMsg',view);
    if(!val){ msg.textContent=''; return; }
    clearTimeout(draftTimer);
    msg.textContent='Checking availability...'; msg.className='msg';
    draftTimer = setTimeout(()=>{
      if(val !== state.user.username && state.takenUsernames.includes(val)){
        msg.textContent='✕ Username already taken'; msg.className='msg err';
      } else {
        msg.textContent='✓ Username available'; msg.className='msg ok';
      }
    }, 500);
  });
  $('#editDiscard',view).onclick = ()=>{
    if(dirty){
      openSheet(`<h3>Discard changes?</h3><p class="hint">Your unsaved edits will be lost.</p>
        <div class="sticky-footer" style="border:none;padding:6px 0 0;">
          <button class="btn btn-outline" id="keepEditingBtn">Keep Editing</button>
          <button class="btn btn-danger-solid" id="discardYesBtn">Discard</button>
        </div>`);
      $('#keepEditingBtn').onclick = closeSheet;
      $('#discardYesBtn').onclick = ()=>{ closeSheet(); go('home'); };
    } else { go('home'); }
  };
  $('#editSave',view).onclick = ()=>{
    const name = $('#e-name',view).value.trim();
    const uname = $('#e-username',view).value.trim();
    if(!name){ toast('Name cannot be empty','error','x'); return; }
    if(uname !== state.user.username && state.takenUsernames.includes(uname.toLowerCase())){ toast('Username is taken','error','x'); return; }
    state.user.name = name; state.user.username = uname;
    openSheet(`<div class="center-flow"><div class="pop-check">${ic('check',36,3)}</div><h3>Profile updated!</h3><p class="hint">Your changes are live.</p></div>`);
    setTimeout(()=>{ closeSheet(); go('home'); }, 1200);
  };
}

      if(!subj){ toast('Please add a subject','error','x'); return; }
      const id = 'TCK-' + Math.floor(1000+Math.random()*9000);
      state.tickets.unshift({id, subject:subj, status:'Open'});
      closeSheet(); toast('Ticket '+id+' raised'); go('help');
    };
  };
}

/* ===================== VIEW: AI CHAT SUPPORT ===================== */
routes.aichat = ()=>`
  ${topbar('AI Chat Support','Usually replies instantly')}
  <div class="chat-box" id="chatBox">
    <div class="bubble bot">Hi! I'm JORA's AI support assistant. Ask me anything about your account, billing, or learning path 👋</div>
  </div>
  <div class="chat-input-row">
    <input id="chatInput" placeholder="Type a message...">
    <button id="chatSend">${ic('back',18)}</button>
  </div>
`;
function bindAiChat(view){
  const box = $('#chatBox',view), input = $('#chatInput',view);
  $('#chatSend',view).style.transform='rotate(180deg)';
  const send = ()=>{
    const val = input.value.trim(); if(!val) return;
    box.appendChild(el(`<div class="bubble me">${val}</div>`));
    input.value=''; box.scrollTop = box.scrollHeight;
    setTimeout(()=>{
      const replies = ["Got it — I've noted that down. You can also check the FAQ section for step-by-step guides.",
        "You can manage that directly from Your Account → Security.",
        "I'll flag this to our team if you'd like to raise a formal ticket — just say the word!",
        "Great question! Your subscription details live under My Subscription."];
      box.appendChild(el(`<div class="bubble bot">${replies[Math.floor(Math.random()*replies.length)]}</div>`));
      box.scrollTop = box.scrollHeight;
    }, 700);
  };
  $('#chatSend',view).onclick = send;
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') send(); });
}

/* ===================== VIEW: FEEDBACK ===================== */
routes.feedback = ()=>`
  ${topbar('Share Feedback','Help us make JORA better')}
  <div class="section-pad">
    <div class="card">
      <h3>How do you feel about JORA?</h3>
      <div class="emoji-row" id="emojiRow">
        ${['😞','😕','😐','🙂','😍'].map((e,i)=>`<button class="emoji-btn" data-emoji="${i+1}">${e}</button>`).join('')}
      </div>
      <h3>Rate your experience</h3>
      <div class="star-row" id="starRow">
        ${[1,2,3,4,5].map(i=>`<span class="st" data-star="${i}" style="color:var(--border)">${ic('star',30,1.5)}</span>`).join('')}
      </div>
    </div>
    <div class="card">
      <div class="field"><label>Category</label>
        <select id="fb-category"><option>General</option><option>Bug Report</option><option>Feature Request</option><option>Content Quality</option><option>Performance</option></select>
      </div>
      <div class="field"><label>Your Feedback</label><textarea id="fb-text" placeholder="Tell us what's working, and what's not..."></textarea></div>
      <div class="field" style="margin-bottom:0;">
        <label>Attach Screenshot (optional)</label>
        <button class="btn btn-outline btn-block" id="attachBtn">${ic('upload',16)} &nbsp;Attach Screenshot</button>
        <input type="file" accept="image/*" id="fbFile" style="display:none">
        <div id="fbPreview"></div>
      </div>
    </div>
    <button class="btn btn-primary btn-block" id="fbSubmit">Submit Feedback</button>
  </div>
`;
function bindFeedback(view){
  let emoji=0, stars=0;
  view.querySelectorAll('[data-emoji]').forEach(b=>b.onclick=()=>{
    view.querySelectorAll('[data-emoji]').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel'); emoji=+b.dataset.emoji;
  });
  view.querySelectorAll('[data-star]').forEach(s=>s.onclick=()=>{
    stars = +s.dataset.star;
    view.querySelectorAll('[data-star]').forEach(x=> x.style.color = (+x.dataset.star<=stars)?'var(--warning)':'var(--border)');
  });
  $('#attachBtn',view).onclick = ()=> $('#fbFile',view).click();
  $('#fbFile',view).onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = ev=>{
      $('#fbPreview',view).innerHTML = `<div class="file-preview"><img src="${ev.target.result}"><div class="fp-name">${f.name}</div><button id="fbRemove">${ic('x',16)}</button></div>`;
      $('#fbRemove',view).onclick = ()=> $('#fbPreview',view).innerHTML='';
    };
    reader.readAsDataURL(f);
  };
  $('#fbSubmit',view).onclick = ()=>{
    const text = $('#fb-text',view).value.trim();
    if(!stars && !emoji){ toast('Please rate your experience','error','x'); return; }
    if(!text){ toast('Please add a few words of feedback','error','x'); return; }
    $('#app').innerHTML = `<section class="view active"><div class="center-flow" style="padding-top:120px;">
      <div class="pop-check" style="width:100px;height:100px;">${ic('check',44,3)}</div>
      <h2 style="margin:0 0 6px;">Thank you!</h2>
      <p class="hint" style="max-width:240px;">Your feedback helps us improve JORA for everyone.</p>
      <div class="badge-plan" style="margin-top:16px;font-size:13px;padding:8px 16px;">+50 XP Rewarded 🎉</div>
      <button class="btn btn-primary" style="margin-top:26px;" id="fbDoneBtn">Back to Profile</button>
    </div></section>`;
    $('#fbDoneBtn').onclick = ()=> go('home');
    state.user.xp += 50;
  };
}

/* ===================== BIND DISPATCH ===================== */
function bindView(route, view){
  view.querySelectorAll('[data-back]').forEach(b=> b.onclick = ()=> go('home'));
  if(route==='home') bindHomeExtras(view);
  if(route==='account') bindAccount(view);
  if(route==='edit') bindEdit(view);
  if(route==='subscription') bindSubscription(view);
  if(route==='notifications') bindNotifications(view);
  if(route==='help') bindHelp(view);
  if(route==='aichat') bindAiChat(view);
  if(route==='feedback') bindFeedback(view);
  if(route==='login'){ $('#backToLoginBtn',view).onclick = ()=>{ toast('Welcome back!'); go('home'); }; }
}

/* ===================== CLOCK ===================== */
function tickClock(){
  const d = new Date();
  let h = d.getHours()%12; if(h===0) h=12;
  const m = d.getMinutes().toString().padStart(2,'0');
  $('#clock').textContent = h+':'+m;
}
tickClock(); setInterval(tickClock, 15000);

/* ===================== INIT ===================== */
go('home');
</script>
