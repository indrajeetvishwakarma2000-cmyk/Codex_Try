<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Social Media Work — DigitalIndra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #000000;
            --card-bg: #121212;
            --card-border: #1c1c1c;
            --card-border-hover: #2e2e2e;
            --ink: #ffffff;
            --text-secondary: #d9d9d9;
            --muted: #8e8e93;
            --border: #1c1c1c;
            --purple: #a159ff;
            --cyan: #1abcfe;
            --purple-grad: linear-gradient(135deg, #1abcfe 0%, #a159ff 100%);
            --radius-pill: 9999px;
            --radius-lg: 18px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--ink);
            font-family: 'Plus Jakarta Sans', 'Manrope', -apple-system, sans-serif;
            font-size: 15px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .wrap {
            width: min(1180px, calc(100% - 48px));
            margin-inline: auto;
            padding: 30px 0 80px;
        }

        /* TOP NAV */
        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0 40px;
            border-bottom: 1px solid var(--border);
        }

        .brand-logo-img {
            height: 48px;
            width: auto;
            display: block;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 13.5px;
            font-weight: 700;
            color: var(--muted);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            padding: 8px 18px;
            border-radius: var(--radius-pill);
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            color: #ffffff;
            border-color: var(--card-border-hover);
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(-2px);
        }

        /* SECTION BADGE */
        .section-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            padding: 5px 14px;
            border-radius: var(--radius-pill);
            margin-bottom: 16px;
        }

        .purple-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--cyan);
            display: inline-block;
            box-shadow: 0 0 8px rgba(26, 188, 254, 0.75);
        }

        .text-gradient {
            background: var(--purple-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        /* HERO */
        .hero {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 30px;
            margin: 50px 0 45px;
        }

        .hero h1 {
            font-size: clamp(38px, 6vw, 68px);
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: -0.04em;
            margin: 10px 0 0;
        }

        .hero p {
            max-width: 400px;
            color: var(--text-secondary);
            font-size: 15.5px;
            line-height: 1.6;
        }

        /* GALLERY */
        .gallery {
            columns: 4 240px;
            column-gap: 20px;
        }

        .gallery a {
            display: block;
            break-inside: avoid;
            margin-bottom: 20px;
            overflow: hidden;
            border-radius: var(--radius-lg);
            background: var(--card-bg);
            border: 1px solid var(--border);
            position: relative;
            transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.28s ease, box-shadow 0.28s ease;
        }

        .gallery a:hover {
            transform: translateY(-5px);
            border-color: var(--card-border-hover);
            box-shadow: 0 16px 36px -4px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.1);
        }

        .gallery img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.35s ease;
        }

        .gallery a:hover img {
            transform: scale(1.03);
        }

        @media (max-width: 768px) {
            .wrap {
                width: calc(100% - 32px);
                padding-top: 20px;
            }

            .hero {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
                margin: 35px 0 30px;
            }

            .gallery {
                columns: 2 160px;
                column-gap: 14px;
            }

            .gallery a {
                margin-bottom: 14px;
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <header class="top-nav">
            <a href="index.html" aria-label="Digital Indra Home">
                <img src="Jora/Logo_Web.png" alt="Digital Indra Logo" class="brand-logo-img" onerror="this.onerror=null; this.src='../Jora/Logo_Web.png';">
            </a>
            <a class="back-btn" href="index.html">
                <i data-lucide="arrow-left" size="16"></i> Back to Portfolio
            </a>
        </header>

        <section class="hero">
            <div>
                <div class="section-badge"><span class="purple-dot"></span>DIGITALINDRA / SOCIAL MEDIA</div>
                <h1>Posts that stop <span class="text-gradient">the scroll.</span></h1>
            </div>
            <p>Brand-led social content, designed to create immediate visual impact while communicating key messages with clarity.</p>
        </section>

        <main class="gallery">
            <a href="Interview/Social_Media_Post/Aaztech26-10-2023.jpg" target="_blank" rel="noopener noreferrer">
                <img src="Interview/Social_Media_Post/Aaztech26-10-2023.jpg" alt="Aaztech post" loading="lazy">
            </a>
            <a href="Interview/Social_Media_Post/Geji.jpg" target="_blank" rel="noopener noreferrer">
                <img src="Interview/Social_Media_Post/Geji.jpg" alt="Geji post" loading="lazy">
            </a>
            <a href="Interview/Social_Media_Post/Geji2.jpg" target="_blank" rel="noopener noreferrer">
                <img src="Interview/Social_Media_Post/Geji2.jpg" alt="Geji post" loading="lazy">
            </a>
            <a href="Interview/Social_Media_Post/Geji3.jpg" target="_blank" rel="noopener noreferrer">
                <img src="Interview/Social_Media_Post/Geji3.jpg" alt="Geji post" loading="lazy">
            </a>
            <a href="Interview/Social_Media_Post/IDG.jpg" target="_blank" rel="noopener noreferrer">
                <img src="Interview/Social_Media_Post/IDG.jpg" alt="IDG post" loading="lazy">
            </a>
            <a href="Interview/Social_Media_Post/Miezu.jpg" target="_blank" rel="noopener noreferrer">
                <img src="Interview/Social_Media_Post/Miezu.jpg" alt="Miezu post" loading="lazy">
            </a>
            <a href="Interview/Social_Media_Post/shantinursingservices.jpg" target="_blank" rel="noopener noreferrer">
                <img src="Interview/Social_Media_Post/shantinursingservices.jpg" alt="Shanti Nursing Services post" loading="lazy">
            </a>
            <a href="Interview/Social_Media_Post/Wolta.jpg" target="_blank" rel="noopener noreferrer">
                <img src="Interview/Social_Media_Post/Wolta.jpg" alt="Wolta post" loading="lazy">
            </a>
            <a href="Interview/Social_Media_Post/Wolta2.jpg" target="_blank" rel="noopener noreferrer">
                <img src="Interview/Social_Media_Post/Wolta2.jpg" alt="Wolta post" loading="lazy">
            </a>
        </main>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>

</html>
